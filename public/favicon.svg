<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Super El Niño Global Impact Simulator">
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="globe" cx="34%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="38%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0b2547"/>
    </radialGradient>
    <!-- Warm anomaly sweep: the ENSO signal, reading left-to-right across the equator. -->
    <linearGradient id="thermal" x1="0%" y1="60%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="32" cy="33" r="21"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#space)"/>

  <!-- Atmospheric halo -->
  <circle cx="32" cy="33" r="24.5" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="2.5"/>
  <!-- Globe body -->
  <circle cx="32" cy="33" r="21" fill="url(#globe)"/>

  <!-- Equatorial thermal band, clipped to the sphere -->
  <g clip-path="url(#globeClip)">
    <rect x="11" y="27" width="42" height="7.5" fill="url(#thermal)"/>
    <!-- Cloud wisps -->
    <path d="M15 22c4-3 9-2 12 0s7 1 10-1" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 40c5-2 8 1 12 1s6-2 9-3" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Hotspot marker on the warm edge -->
  <circle cx="46" cy="30.5" r="2.6" fill="#ffffff"/>
  <circle cx="46" cy="30.5" r="5.2" fill="none" stroke="#fbbf24" stroke-opacity="0.85" stroke-width="1.4"/>
</svg>
